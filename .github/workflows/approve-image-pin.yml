# Auto-approve dcp's image-pin PR: dfo-dcp's CI builds and pushes an image,
# then opens a PR here, on the fixed branch deploy/dcp-dev, that changes only
# infra/dfo-dev/dcp/image.auto.tfvars. dcp's Cloud Run service comes from a
# pinned upstream module that leaves nothing here to attach
# lifecycle.ignore_changes to, so only a real terraform apply can change its
# image, and that apply needs this PR merged first. apply.yml runs it once
# the PR lands on main.
#
# This workflow approves but does NOT merge. Auto-merge is armed by dfo-dcp's
# deploy-dev.yml, using the GitHub App token it already mints for opening the
# PR. It used to be armed here with GITHUB_TOKEN, which broke deploys between
# 2026-07-30 and 2026-07-31: GitHub creates no workflow runs from
# GITHUB_TOKEN-authored events, so the squash-merge push to main never
# triggered apply.yml's on.push. Pins merged and were never applied -- #94
# and #95 both merged as app/github-actions with no Terraform Apply run,
# while every human-merged PR applied normally, leaving dfo-dev on the
# 2026-07-28 image while main pointed at a newer digest.
#
# Approval stays on GITHUB_TOKEN deliberately: a GitHub App cannot approve
# its own PR, and dfo-bot is the author. Only the merge needed to move.
#
# Dev only. The job runs only where the repository owner is ONEcampaign. In
# the DevelopmentFinanceObservatory copy of this repo nothing auto-approves:
# prod's pin PR, which changes infra/dfo-prod/dcp/image.auto.tfvars, waits for
# a human approval from the `release` team like every other PR.
#
# Auto-approval stands in for the human review /infra/ normally requires
# (CODEOWNERS), because the PR author is a GitHub App installation token,
# not a code owner. It is safe only because three checks all pass:
#   1. scripts/check-image-pin-diff.sh proves the diff can only be a pin
#      bump: one file touched, one line changed, and the new value matches
#      the pin's exact shape — a digest, never a tag. Artifact Registry IAM
#      has no per-tag granularity, so another writer on the shared repo
#      could overwrite a tag; a digest pin makes that a no-op, since the
#      digest names the bytes directly.
#   2. The new digest has to resolve in Artifact Registry, checked below via
#      gcloud, so a merge can't pin a reference to nothing.
#   3. The PR author is dfo-bot[bot], so its token was minted with the
#      dfo-bot App's private key. dfo-bot belongs to ONEcampaign and is
#      installed only there, so its key cannot reach the new org. The key
#      sits in two places: dfo-dcp's dev environment, behind that
#      environment's dev-only deployment branch policy, and dfo-docs's
#      repository secrets, for docsync. A workflow in either can author a PR
#      as dfo-bot[bot]. This is the trust boundary the workflow relies on.
#      Nothing below re-derives it, and nothing here can detect it widening.
#
# A known gap: if another PR merges to main while a pin PR has auto-merge
# queued, GitHub updates the pin PR's branch as github-actions[bot], and
# pushes from that identity don't trigger workflows, so the PR sits
# unmergeable until the next dcp deploy force-pushes it again. Rare and
# self-healing enough not to engineer around.
name: Approve dcp image pin

# Runs on synchronize because branch protection's dismiss_stale_reviews
# drops this workflow's approval on every force-push to deploy/dcp-dev,
# which dfo-dcp's CI reuses (not recreates) on each deploy, so each push
# needs a fresh approval.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  # contents: read is enough now that this workflow no longer arms
  # auto-merge (that moved to dfo-dcp's deploy-dev.yml). It only checks out
  # the base commit and reads git objects; the approval itself needs
  # pull-requests: write, not contents: write.
  contents: read
  pull-requests: write
  id-token: write
  # "Wait for plan (dcp)" polls that job's check run via the API, which
  # needs Checks read.
  checks: read

concurrency:
  group: approve-image-pin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    name: Verify and approve
    runs-on: ubuntu-latest
    # The author check is the authorization boundary. A branch name is not:
    # anyone with write access here can push deploy/dcp-dev and open a PR
    # from it, and without the author condition they could pin any digest
    # already in Artifact Registry without a code owner seeing it. Only a
    # holder of the dfo-bot App's private key can author a PR as
    # dfo-bot[bot]: dfo-dcp's dev environment and dfo-docs's docsync.
    #
    # Keep this login in step with the App slug. Renaming the App breaks
    # auto-approval closed, which is the safe direction.
    if: |
      github.repository_owner == 'ONEcampaign' &&
      github.event.pull_request.user.login == 'dfo-bot[bot]' &&
      github.head_ref == 'deploy/dcp-dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          # Checking out the base commit, not leaving ref: unset, is what
          # makes auto-approval safe: a bare checkout on a pull_request event
          # checks out the PR's own tree, so the validator below would run
          # the PR's copy of itself and could be rewritten to always pass.
          ref: ${{ github.event.pull_request.base.sha }}
          # check-image-pin-diff.sh diffs base.sha against head.sha directly;
          # both need to exist as git objects, which a shallow checkout
          # doesn't guarantee. fetch-depth: 0 covers base.sha's history but
          # not head.sha's if the PR branch has moved since the clone depth
          # was measured; the next step fetches head.sha explicitly.
          fetch-depth: 0

      - name: Fetch the PR head commit
        # actions/checkout above only guarantees base.sha is present; head.sha
        # needs fetching separately for the diff below.
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Check diff shape (file touched, single line, value pattern)
        id: diff
        run: |
          set +e
          scripts/check-image-pin-diff.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            >diff_stdout.txt 2>diff_stderr.txt
          echo "exit_code=$?" >>"$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF)
        if: steps.diff.outputs.exit_code == '0'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_PLAN_SA }}

      - name: Setup gcloud
        if: steps.diff.outputs.exit_code == '0'
        uses: google-github-actions/setup-gcloud@v3

      # WIF_PLAN_SA is dfo-infra-planner, the same read-only identity
      # plan.yml uses. Its roles/viewer covers artifactregistry.reader,
      # enough for this call.
      - name: Check the digest resolves in Artifact Registry
        id: registry
        if: steps.diff.outputs.exit_code == '0'
        run: |
          set +e
          image="$(cat diff_stdout.txt)"
          gcloud artifacts docker images describe "$image" --quiet \
            >registry_stdout.txt 2>registry_stderr.txt
          echo "exit_code=$?" >>"$GITHUB_OUTPUT"

      # plan (dcp) is not a required status check on main, so the auto-merge
      # armed by dfo-dcp would otherwise become mergeable the moment this
      # workflow approves -- without ever waiting for the destroy guard on
      # this commit to run. Polling for its result here, before approving,
      # closes that gap; a human-reviewed PR still just sees the check in the
      # PR's check list.
      #
      # It cannot simply be made a required check: plan (dcp) is a matrix job
      # that only runs when the dcp stack changes, so requiring it would block
      # every non-dcp PR on a check that never reports.
      - name: Wait for plan (dcp) to pass
        id: planwait
        if: steps.diff.outputs.exit_code == '0' && steps.registry.outputs.exit_code == '0'
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          conclusion="null"
          # 15s x 60 = 15 minutes, generous since bailing early would fail a
          # pin PR that's just slow, not actually broken.
          for _ in $(seq 1 60); do
            read -r status conclusion <<<"$(gh api "repos/$REPO/commits/$sha/check-runs" --jq \
              '[.check_runs[] | select(.name == "plan (dcp)")][0] | "\(.status // "missing") \(.conclusion // "null")"')"
            [ "$status" = "completed" ] && break
            sleep 15
          done
          echo "conclusion=$conclusion" >>"$GITHUB_OUTPUT"

      - name: Comment and stop if any check failed
        # Each step's if: only runs when everything before it succeeded, so
        # an unset output here means an earlier step already failed.
        if: steps.diff.outputs.exit_code != '0' || steps.registry.outputs.exit_code != '0' || steps.planwait.outputs.conclusion != 'success'
        run: |
          {
            echo "Not auto-approving — this PR doesn't match the expected image-pin shape."
            echo
            if [ "${{ steps.diff.outputs.exit_code }}" != "0" ]; then
              echo "**Diff shape check failed:**"
              echo '```'
              cat diff_stderr.txt
              echo '```'
            elif [ "${{ steps.registry.outputs.exit_code }}" != "0" ]; then
              echo "**Artifact Registry check failed** for \`$(cat diff_stdout.txt)\`:"
              echo '```'
              cat registry_stderr.txt
              echo '```'
            else
              echo "**\`plan (dcp)\` did not succeed** (conclusion: \`${{ steps.planwait.outputs.conclusion }}\`) — not merging a pin ahead of its own destroy guard. Check that job's run for details."
            fi
            echo
            echo "A human needs to review this PR normally — see the header comment in .github/workflows/approve-image-pin.yml for what's checked and why."
          } >comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
          exit 1

      # This approval is the gate. Auto-merge is already armed on the PR by
      # dfo-dcp's deploy-dev.yml, but branch protection requires an approving
      # review, so nothing merges until this step runs -- and it only runs
      # after the three checks above have passed. Arming early cannot outrun
      # the approval.
      - name: Approve
        run: |
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Auto-approved: diff is exactly the \`datacommons_services_image\` pin in \`infra/dfo-dev/dcp/image.auto.tfvars\`, the digest resolves in Artifact Registry, and \`plan (dcp)\` succeeded. See .github/workflows/approve-image-pin.yml for the full check."
