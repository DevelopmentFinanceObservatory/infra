# Fail any PR into dev that adds, edits, renames or deletes
# infra/dfo-prod/dcp/image.auto.tfvars. The dcp repo's prod release build
# writes that pin with a PR straight into main. A release merges dev into
# main, and the merge keeps main's pin only while dev leaves the file alone,
# so an edit on dev would roll prod's dcp image back at the next release.
#
# Runs on every ready PR into dev, with no paths filter, so it can be a
# required check on dev. It skips while the PR is a draft and runs again on
# `ready_for_review`.
name: Prod pin placeholder

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Prod pin placeholder unchanged
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PIN_FILE: infra/dfo-prod/dcp/image.auto.tfvars
    steps:
      - name: Check the PR's files
        run: |
          # One line per changed file: status, path, and the old path of a
          # rename, so a rename away from the file counts too.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | "\(.status) \(.filename) \(.previous_filename // "")"' >files.txt
          echo "Checked $(wc -l <files.txt) changed file(s)."
          if awk -v pin="$PIN_FILE" '$2 == pin || $3 == pin { found = 1 } END { exit !found }' files.txt; then
            echo "::error file=$PIN_FILE::This PR changes $PIN_FILE. Only the dcp repo's prod release writes that file, on main, and a dev edit would roll prod's dcp image back at the next release. Revert the change."
            exit 1
          fi
