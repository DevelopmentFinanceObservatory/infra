[project]
name = "dfo"
version = "0.1.0"
description = "Development Finance Observatory — self-hosted Data Commons Platform (infra, data, tooling)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-include = ["*.ipynb"]
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "*.egg-info", ".pytest_cache", "htmlcov"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ERA", "PERF", "ANN"]
ignore = ["E501", "PLR0913", "PLR0912", "PLR0914", "PLR0915", "PLR2004", "ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004"]
"**/*.ipynb" = ["ANN", "F401", "F811", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
